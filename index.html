<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Scotia Cruise Schedule - Halifax & Sydney</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #060d1a;
      color: #ffffff;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
      gap: 15px;
    }

    /* Top Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0b1836 0%, #12224a 100%);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #1a2744;
    }
    .brand-title h1 {
      color: #d4af37;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .brand-title p {
      color: #8ab4f8;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .datetime {
      color: #00bfff;
      font-size: 24px;
      font-weight: bold;
    }

    /* Ports Layout Container */
    .ports-container {
      display: flex;
      gap: 20px;
      flex-grow: 1;
      overflow: hidden;
    }

    .port-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d152a;
      border-radius: 8px;
      border: 1px solid #1a2744;
      overflow: hidden;
    }

    .port-header {
      background: #121d36;
      padding: 15px 20px;
      border-bottom: 2px solid #1a2744;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .port-header h2 {
      color: #ffffff;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .port-header .subtitle {
      color: #d4af37;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Table Area */
    .table-area {
      flex-grow: 1;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #0b1836;
      color: #00bfff;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 2px solid #1a2744;
    }
    td {
      font-size: 16px;
      border-bottom: 1px solid rgba(26, 39, 68, 0.4);
      color: #ffffff;
    }
    tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    tr:hover { background-color: rgba(0, 191, 255, 0.05); }

    /* Color-coded Status Badges */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-inport { background: #137333; color: #ceead6; }
    .status-enroute { background: #1f3864; color: #8ab4f8; }
    .status-departed { background: #810e15; color: #fad2d3; }
    .status-time { background: #202124; color: #bdc1c6; }

    .empty-row {
      text-align: center;
      padding: 30px;
      color: #8ab4f8;
      font-style: italic;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1836;
      padding: 12px 25px;
      border-radius: 8px;
      border: 1px solid #1a2744;
      font-size: 14px;
    }
    .footer-left { color: #8ab4f8; }
    .footer-right { color: #00bfff; font-weight: bold; }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Top Header -->
    <div class="top-header">
      <div class="brand-title">
        <h1>Nova Scotia Cruise Schedule</h1>
        <p>Live Port Arrivals & Status</p>
      </div>
      <div id="live-datetime" class="datetime">Loading...</div>
    </div>

    <!-- Side-by-Side Port Columns -->
    <div class="ports-container">
      
      <!-- HALIFAX COLUMN -->
      <div class="port-column">
        <div class="port-header">
          <h2>Halifax</h2>
          <span class="subtitle">Nova Scotia</span>
        </div>
        <div class="table-area">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Ship Name</th>
                <th>Arrival / Dep</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="halifax-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- SYDNEY COLUMN -->
      <div class="port-column">
        <div class="port-header">
          <h2>Sydney</h2>
          <span class="subtitle">Nova Scotia</span>
        </div>
        <div class="table-area">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Ship Name</th>
                <th>Arrival / Dep</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="sydney-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-left">Stay connected for the latest updates and cruise news.</div>
      <div class="footer-right">portofhalifax.ca</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-datetime').textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function parseTime(timeStr) {
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function getDynamicStatus(itemDateStr, statusStr) {
      if (!statusStr || !statusStr.includes('-')) {
        return `<span class="status-badge status-time">${statusStr || '—'}</span>`;
      }

      const times = statusStr.split('-').map(t => t.trim());
      if (times.length !== 2 || !times[0].includes(':') || !times[1].includes(':')) {
        return `<span class="status-badge status-time">${statusStr}</span>`;
      }

      const now = new Date();
      const itemDate = new Date(`${itemDateStr} 2026`);
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetDate = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());

      const currentTimeMins = now.getHours() * 60 + now.getMinutes();
      const arrivalMins = parseTime(times[0]);
      const departureMins = parseTime(times[1]);

      let badgeClass = "status-time";
      let label = statusStr;

      if (targetDate > todayDate) {
        badgeClass = "status-enroute";
        label = `En Route (${statusStr})`;
      } else if (targetDate < todayDate) {
        badgeClass = "status-departed";
        label = `Departed (${statusStr})`;
      } else {
        if (currentTimeMins < arrivalMins) {
          badgeClass = "status-enroute";
          label = `En Route (${statusStr})`;
        } else if (currentTimeMins >= arrivalMins && currentTimeMins <= departureMins) {
          badgeClass = "status-inport";
          label = `In Port (${statusStr})`;
        } else {
          badgeClass = "status-departed";
          label = `Departed (${statusStr})`;
        }
      }

      return `<span class="status-badge ${badgeClass}">${label}</span>`;
    }

    async function loadSchedule() {
      const jsonUrl = './cruise_schedule.json';

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        let halifaxHTML = '';
        let sydneyHTML = '';

        data.forEach(item => {
          const statusBadge = getDynamicStatus(item.date, item.status);
          const row = `<tr>
            <td>${item.date}</td>
            <td><strong>${item.ship}</strong></td>
            <td>${item.status || '—'}</td>
            <td>${statusBadge}</td>
          </tr>`;

          if (item.port && item.port.toLowerCase() === 'halifax') {
            halifaxHTML += row;
          } else if (item.port && item.port.toLowerCase() === 'sydney') {
            sydneyHTML += row;
          }
        });

        document.getElementById('halifax-tbody').innerHTML = halifaxHTML || '<tr><td colspan="4" class="empty-row">No scheduled arrivals for Halifax.</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = sydneyHTML || '<tr><td colspan="4" class="empty-row">No scheduled arrivals for Sydney.</td></tr>';

      } catch (err) {
        console.error('Schedule fetch error:', err);
        document.getElementById('halifax-tbody').innerHTML = '<tr><td colspan="4" class="empty-row">Unable to load data.</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = '<tr><td colspan="4" class="empty-row">Unable to load data.</td></tr>';
      }
    }

    loadSchedule();
  </script>
</body>
</html>
