<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port of Halifax & Sydney - Live Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      /* Uses your background.jpg poster as the exact full-screen backdrop */
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 60px; /* Adjust padding to match poster margins if needed */
    }

    /* Live Clock overlayed at top right */
    .top-clock {
      position: absolute;
      top: 30px;
      right: 60px;
      color: #00bfff;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Wrapper matching the two table areas on the poster */
    .schedules-overlay {
      display: flex;
      flex-direction: column;
      gap: 140px; /* Space between Halifax table block and Sydney table block */
      margin-top: 180px; /* Push down to align with the poster's white boxes */
      width: 58%;
      margin-left: 39%; /* Align to the right side where the table columns are */
    }

    .table-section {
      max-height: 240px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px 12px;
      text-align: left;
      font-size: 15px;
      white-space: nowrap;
    }

    /* Hide table headers since the poster already prints 'DATE | SHIP NAME | ARRIVAL | DEPARTURE | BERTH' */
    thead {
      display: none;
    }

    td {
      color: #111111; /* Dark text to contrast nicely against the poster's white placeholder boxes */
      font-weight: bold;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    tr:hover {
      background-color: rgba(0, 191, 255, 0.1);
    }

    .empty-row {
      text-align: center;
      color: #555555;
      font-style: italic;
      font-weight: normal;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Live Clock -->
    <div id="live-datetime" class="top-clock">Loading...</div>

    <!-- Schedules Container aligned over the poster's placeholder slots -->
    <div class="schedules-overlay">
      
      <!-- HALIFAX TABLE SLOT -->
      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ship Name</th>
              <th>Arrival</th>
              <th>Departure</th>
              <th>Berth</th>
            </tr>
          </thead>
          <tbody id="halifax-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>

      <!-- SYDNEY TABLE SLOT -->
      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ship Name</th>
              <th>Arrival</th>
              <th>Departure</th>
              <th>Berth</th>
            </tr>
          </thead>
          <tbody id="sydney-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-datetime').textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadSchedule() {
      const jsonUrl = './cruise_schedule.json';

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        let halifaxHTML = '';
        let sydneyHTML = '';

        data.forEach(item => {
          let arrival = '—';
          let departure = '—';

          if (item.status && item.status.includes('-')) {
            const parts = item.status.split('-').map(t => t.trim());
            if (parts.length === 2) {
              arrival = parts[0];
              departure = parts[1];
            }
          } else if (item.status) {
            arrival = item.status;
          }

          const row = `<tr>
            <td>${item.date}</td>
            <td>${item.ship}</td>
            <td>${arrival}</td>
            <td>${departure}</td>
            <td>${item.passengers ? item.passengers + ' Pax' : '—'}</td>
          </tr>`;

          if (item.port && item.port.toLowerCase() === 'halifax') {
            halifaxHTML += row;
          } else if (item.port && item.port.toLowerCase() === 'sydney') {
            sydneyHTML += row;
          }
        });

        document.getElementById('halifax-tbody').innerHTML = halifaxHTML || '<tr><td colspan="5" class="empty-row">No scheduled arrivals</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = sydneyHTML || '<tr><td colspan="5" class="empty-row">No scheduled arrivals</td></tr>';

      } catch (err) {
        console.error('Schedule fetch error:', err);
      }
    }

    loadSchedule();
  </script>
</body>
</html>
