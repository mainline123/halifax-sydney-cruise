<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova Scotia Cruise Ship Schedule</title>

  <style>
    :root {
      --bg: #061525;
      --panel: #0d2740;
      --panel2: #123552;
      --blue: #55c8ff;
      --gold: #ffd166;
      --white: #ffffff;
      --muted: #b9cad8;
      --line: rgba(255,255,255,0.14);
      --halifax: #55c8ff;
      --sydney: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        linear-gradient(rgba(3,15,27,.90), rgba(3,15,27,.94)),
        url("background.jpg") center center / cover no-repeat;

      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      flex-direction: column;

      padding: 2vh 2vw;
    }

    /* HEADER */

    header {
      flex-shrink: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(13,39,64,.94);

      border-bottom: 4px solid var(--blue);
      border-radius: 14px;

      padding: 1.8vh 2vw;
      margin-bottom: 1.5vh;
    }

    .title h1 {
      font-size: clamp(26px, 3vw, 50px);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .title .subtitle {
      margin-top: .5vh;

      font-size: clamp(16px, 1.5vw, 25px);
      font-weight: 700;

      color: var(--blue);
    }

    .clock-area {
      text-align: right;
    }

    #clock {
      font-family: monospace;
      font-size: clamp(25px, 3vw, 48px);
      font-weight: 900;
      color: var(--gold);
    }

    #today {
      margin-top: .4vh;

      color: var(--muted);
      font-size: clamp(13px, 1.2vw, 20px);
      font-weight: 700;

      text-transform: uppercase;
    }

    /* BOARD */

    .board {
      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;

      background: rgba(13,39,64,.94);

      border-radius: 14px;

      padding: 1vh 1vw;

      overflow: hidden;
    }

    .head,
    .row {
      display: grid;

      grid-template-columns:
        13%
        29%
        14%
        14%
        15%
        15%;

      align-items: center;
    }

    .head {
      flex-shrink: 0;

      min-height: 6vh;

      border-bottom: 3px solid var(--blue);

      color: var(--blue);

      font-size: clamp(15px, 1.35vw, 23px);
      font-weight: 900;

      text-transform: uppercase;
    }

    .head div,
    .row div {
      padding: 0 .8vw;
    }

    #schedule {
      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-rows: repeat(12, minmax(0, 1fr));
    }

    .row {
      min-height: 0;

      border-bottom: 1px solid var(--line);

      font-size: clamp(16px, 1.55vw, 27px);
      font-weight: 700;
    }

    .row:nth-child(even) {
      background: rgba(255,255,255,.025);
    }

    .ship {
      font-weight: 900;
      color: var(--white);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .port {
      display: inline-block;

      padding: .7vh .8vw;

      border-radius: 7px;

      text-align: center;

      font-size: .88em;
      font-weight: 900;
      text-transform: uppercase;
    }

    .halifax {
      background: var(--halifax);
      color: #00131f;
    }

    .sydney {
      background: var(--sydney);
      color: #1b1300;
    }

    .passengers {
      font-weight: 800;
    }

    .time {
      font-family: monospace;
      font-weight: 900;
    }

    /* EMPTY / ERROR MESSAGE */

    .message {
      grid-column: 1 / -1;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      font-size: clamp(20px, 2vw, 34px);
      font-weight: 800;

      color: var(--muted);

      padding: 4vh;
    }

    /* FOOTER */

    footer {
      flex-shrink: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 1.2vh .5vw 0;

      color: var(--muted);

      font-size: clamp(12px, 1vw, 17px);
      font-weight: 700;
    }

    #page-info {
      color: var(--gold);
    }

    #sync {
      color: #62e6a7;
    }
  </style>
</head>

<body>

<header>

  <div class="title">
    <h1>Nova Scotia Cruise Ship Schedule</h1>

    <div class="subtitle">
      Halifax • Sydney
    </div>
  </div>

  <div class="clock-area">
    <div id="clock">--:--:--</div>
    <div id="today">---</div>
  </div>

</header>


<div class="board">

  <div class="head">
    <div>Date</div>
    <div>Ship</div>
    <div>Port</div>
    <div>Passengers</div>
    <div>Arrival</div>
    <div>Departure</div>
  </div>

  <div id="schedule"></div>

</div>


<footer>

  <span>
    Halifax &amp; Sydney • Nova Scotia Cruise Information
  </span>

  <span id="page-info">
    PAGE 1 / 1
  </span>

  <span id="sync">
    Loading schedule...
  </span>

</footer>


<script>

const DATA_FILE = "cruise_schedule.json";

const PER_PAGE = 12;

const ROTATE_MS = 12000;

const REFRESH_MS = 5 * 60 * 1000;

let cruiseData = [];

let page = 0;

let rotateTimer = null;


/* CLOCK */

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });

  document.getElementById("today").textContent =
    now.toLocaleDateString([], {
      weekday: "short",
      month: "short",
      day: "numeric",
      year: "numeric"
    });
}

updateClock();

setInterval(updateClock, 1000);


/* SPLIT ARRIVAL / DEPARTURE */

function splitTimes(status) {

  const value = String(status || "").trim();

  if (!value) {
    return {
      arrival: "—",
      departure: "—"
    };
  }

  if (value.includes(" - ")) {

    const parts = value.split(" - ");

    return {
      arrival: parts[0] || "—",
      departure: parts[1] || "—"
    };
  }

  if (value.toLowerCase().includes("arrival")) {

    const match =
      value.match(/(\d{1,2}:\d{2})\s*$/);

    return {
      arrival: "—",
      departure: match ? match[1] : value
    };
  }

  return {
    arrival: value,
    departure: "—"
  };
}


/* DATE SORTING */

function dateNumber(dateText) {

  const currentYear =
    new Date().getFullYear();

  const parsed =
    new Date(`${dateText} ${currentYear}`);

  if (isNaN(parsed.getTime())) {
    return Number.MAX_SAFE_INTEGER;
  }

  return parsed.getTime();
}


/* RENDER */

function render() {

  const container =
    document.getElementById("schedule");

  if (!cruiseData.length) {

    container.innerHTML =
      `<div class="message">
        No cruise ships currently listed.
      </div>`;

    document.getElementById("page-info")
      .textContent = "PAGE 1 / 1";

    return;
  }

  const totalPages =
    Math.max(
      1,
      Math.ceil(cruiseData.length / PER_PAGE)
    );

  if (page >= totalPages) {
    page = 0;
  }

  const start =
    page * PER_PAGE;

  const current =
    cruiseData.slice(
      start,
      start + PER_PAGE
    );

  container.innerHTML =
    current.map(item => {

      const times =
        splitTimes(item.status);

      const portClass =
        String(item.port)
          .toLowerCase() === "sydney"
          ? "sydney"
          : "halifax";

      return `
        <div class="row">

          <div>
            ${item.date || "—"}
          </div>

          <div class="ship">
            ${item.ship || "—"}
          </div>

          <div>
            <span class="port ${portClass}">
              ${item.port || "—"}
            </span>
          </div>

          <div class="passengers">
            ${item.passengers || "—"}
          </div>

          <div class="time">
            ${times.arrival}
          </div>

          <div class="time">
            ${times.departure}
          </div>

        </div>
      `;

    }).join("");

  document.getElementById("page-info")
    .textContent =
      `PAGE ${page + 1} / ${totalPages}`;
}


/* PAGE ROTATION */

function startRotation() {

  if (rotateTimer) {
    clearInterval(rotateTimer);
  }

  rotateTimer =
    setInterval(() => {

      const totalPages =
        Math.max(
          1,
          Math.ceil(
            cruiseData.length / PER_PAGE
          )
        );

      if (totalPages > 1) {

        page =
          (page + 1) % totalPages;

        render();
      }

    }, ROTATE_MS);
}


/* LOAD JSON */

async function loadSchedule() {

  const sync =
    document.getElementById("sync");

  try {

    const response =
      await fetch(
        `${DATA_FILE}?v=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {
      throw new Error(
        "Schedule is not an array"
      );
    }

    cruiseData =
      data
        .filter(item =>
          item &&
          item.ship &&
          item.date &&
          item.port
        )
        .sort(
          (a, b) =>
            dateNumber(a.date) -
            dateNumber(b.date)
        );

    page = 0;

    render();

    startRotation();

    sync.textContent =
      "Schedule Loaded • " +
      new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  }

  catch (error) {

    console.error(
      "Cruise schedule error:",
      error
    );

    sync.textContent =
      "Schedule Connection Error";

    sync.style.color =
      "#ff8585";
  }
}


/* START */

loadSchedule();

setInterval(
  loadSchedule,
  REFRESH_MS
);

</script>

</body>
</html>
