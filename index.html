<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Scotia Cruise Schedule - Halifax & Sydney</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      /* Full-screen poster background */
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 20px 40px;
    }

    /* Live Clock overlayed at top right */
    .top-clock {
      position: absolute;
      top: 25px;
      right: 50px;
      color: #00bfff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* Container holding both schedule slots mapped over the poster */
    .schedules-wrapper {
      position: absolute;
      top: 158px; /* Aligned with Halifax white placeholder rows */
      left: 36.5%;
      width: 60.5%;
      display: flex;
      flex-direction: column;
      gap: 138px; /* Distance between the Halifax and Sydney placeholder boxes */
    }

    .table-section {
      max-height: 220px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    /* Hide table headers since the poster background already displays them */
    thead {
      display: none;
    }

    th, td {
      padding: 6px 10px;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    td {
      color: #111111; /* Dark text for legibility inside the poster's white rows */
      font-weight: bold;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    tr:hover {
      background-color: rgba(0, 191, 255, 0.15);
    }

    /* Color-coded Status Badges */
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-inport { background: #137333; color: #ceead6; }
    .status-enroute { background: #1f3864; color: #8ab4f8; }
    .status-departed { background: #810e15; color: #fad2d3; }
    .status-time { background: #202124; color: #bdc1c6; }

    .empty-row {
      text-align: center;
      color: #555555;
      font-style: italic;
      font-weight: normal;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Live Clock -->
    <div id="live-datetime" class="top-clock">Loading...</div>

    <!-- Two separate placeholders aligned over Halifax and Sydney poster slots -->
    <div class="schedules-wrapper">
      
      <!-- HALIFAX TABLE PLACEHOLDER -->
      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ship Name</th>
              <th>Arrival</th>
              <th>Departure</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="halifax-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>

      <!-- SYDNEY TABLE PLACEHOLDER -->
      <div class="table-section">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ship Name</th>
              <th>Arrival</th>
              <th>Departure</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sydney-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-datetime').textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function parseTime(timeStr) {
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function getDynamicStatus(itemDateStr, statusStr) {
      if (!statusStr || !statusStr.includes('-')) {
        return `<span class="status-badge status-time">${statusStr || '—'}</span>`;
      }

      const times = statusStr.split('-').map(t => t.trim());
      if (times.length !== 2 || !times[0].includes(':') || !times[1].includes(':')) {
        return `<span class="status-badge status-time">${statusStr}</span>`;
      }

      const now = new Date();
      const itemDate = new Date(`${itemDateStr} 2026`);
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetDate = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());

      const currentTimeMins = now.getHours() * 60 + now.getMinutes();
      const arrivalMins = parseTime(times[0]);
      const departureMins = parseTime(times[1]);

      let badgeClass = "status-time";
      let label = statusStr;

      if (targetDate > todayDate) {
        badgeClass = "status-enroute";
        label = `En Route (${statusStr})`;
      } else if (targetDate < todayDate) {
        badgeClass = "status-departed";
        label = `Departed (${statusStr})`;
      } else {
        if (currentTimeMins < arrivalMins) {
          badgeClass = "status-enroute";
          label = `En Route (${statusStr})`;
        } else if (currentTimeMins >= arrivalMins && currentTimeMins <= departureMins) {
          badgeClass = "status-inport";
          label = `In Port (${statusStr})`;
        } else {
          badgeClass = "status-departed";
          label = `Departed (${statusStr})`;
        }
      }

      return `<span class="status-badge ${badgeClass}">${label}</span>`;
    }

    async function loadSchedule() {
      const jsonUrl = './cruise_schedule.json';

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        let halifaxHTML = '';
        let sydneyHTML = '';

        data.forEach(item => {
          const statusBadge = getDynamicStatus(item.date, item.status);
          const row = `<tr>
            <td>${item.date}</td>
            <td><strong>${item.ship}</strong></td>
            <td>${item.status ? item.status.split('-')[0].trim() : '—'}</td>
            <td>${item.status && item.status.includes('-') ? item.status.split('-')[1].trim() : '—'}</td>
            <td>${statusBadge}</td>
          </tr>`;

          if (item.port && item.port.toLowerCase() === 'halifax') {
            halifaxHTML += row;
          } else if (item.port && item.port.toLowerCase() === 'sydney') {
            sydneyHTML += row;
          }
        });

        document.getElementById('halifax-tbody').innerHTML = halifaxHTML || '<tr><td colspan="5" class="empty-row">No scheduled arrivals</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = sydneyHTML || '<tr><td colspan="5" class="empty-row">No scheduled arrivals</td></tr>';

      } catch (err) {
        console.error('Schedule fetch error:', err);
      }
    }

    loadSchedule();
  </script>
</body>
</html>
