<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Scotia Cruise Arrivals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #080d1a;
      color: #ffffff;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 35px;
    }
    .header {
      border-bottom: 3px solid #1a233a;
      padding-bottom: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      color: #d4af37;
      font-size: 38px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .datetime {
      color: #00bfff;
      font-size: 28px;
      font-weight: bold;
      text-align: right;
      min-width: 300px;
    }
    .table-container {
      flex-grow: 1;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #12192c;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 22px 24px;
      text-align: left;
    }
    th {
      background-color: #18223c;
      color: #00bfff;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 2px solid #1a233a;
    }
    td {
      font-size: 26px;
      border-bottom: 1px solid #1a233a;
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.03); }
    .port-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 22px;
      font-weight: bold;
      background: #1e2d4a;
      color: #8ab4f8;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Header with Title and Live Date/Time -->
    <div class="header">
      <h1>Nova Scotia Cruise Arrivals</h1>
      <div id="live-datetime" class="datetime">Loading...</div>
    </div>

    <!-- Main Schedule Table (Takes up the rest of the screen) -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Vessel Name</th>
            <th>Port</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="schedule-body">
          <!-- Data rows injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Live Clock Function
    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-datetime').textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Schedule Loader
    async function loadSchedule() {
      const jsonUrl = './cruise_schedule.json';

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        
        const data = await res.json();
        const tbody = document.getElementById('schedule-body');
        
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">No upcoming cruise arrivals scheduled.</td></tr>';
          return;
        }

        let rowsHTML = '';
        data.forEach(item => {
          rowsHTML += `<tr>
            <td>${item.date}</td>
            <td><strong>${item.ship}</strong></td>
            <td><span class="port-badge">${item.port}</span></td>
            <td>${item.status}</td>
          </tr>`;
        });

        tbody.innerHTML = rowsHTML;

      } catch (err) {
        console.error('Schedule fetch error:', err);
        document.getElementById('schedule-body').innerHTML = `
          <tr>
            <td>Today</td>
            <td><strong>Check Front Desk</strong></td>
            <td><span class="port-badge">Halifax</span></td>
            <td>In Port</td>
          </tr>`;
      }
    }

    loadSchedule();
  </script>
</body>
</html>
