<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Halifax Cruise Ship Schedule</title>

<style>
:root{
  --bg:#061321;
  --panel:#0d2238;
  --line:#29445e;
  --blue:#62c9ff;
  --gold:#ffd166;
  --white:#ffffff;
  --muted:#b8c9d8;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    linear-gradient(rgba(3,15,26,.88),rgba(3,15,26,.94)),
    url("background.jpg") center/cover no-repeat;

  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;

  display:flex;
  flex-direction:column;

  padding:2vh 3vw;
}

/* HEADER */

header{
  flex-shrink:0;

  background:rgba(13,34,56,.96);

  border-radius:16px;
  border-bottom:5px solid var(--blue);

  padding:2.2vh 3vw;

  margin-bottom:1.5vh;

  text-align:center;
}

h1{
  margin:0;

  font-size:clamp(27px,5vw,54px);
  line-height:1.05;

  font-weight:900;
  letter-spacing:1px;

  text-transform:uppercase;
}

.subtitle{
  margin-top:.8vh;

  color:var(--blue);

  font-size:clamp(18px,3vw,31px);
  font-weight:800;
}

.clock{
  margin-top:1.5vh;

  color:var(--gold);

  font-family:monospace;
  font-size:clamp(25px,4.5vw,46px);
  font-weight:900;
}

.date{
  margin-top:.4vh;

  color:var(--muted);

  font-size:clamp(14px,2.2vw,23px);
  font-weight:700;

  text-transform:uppercase;
}


/* BOARD */

.board{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  background:rgba(13,34,56,.96);

  border-radius:16px;

  padding:1.3vh 2vw;

  overflow:hidden;
}

.board-head,
.row{
  display:grid;

  grid-template-columns:
    17%
    36%
    22%
    25%;

  align-items:center;
}

.board-head{
  flex-shrink:0;

  min-height:5.5vh;

  color:var(--blue);

  border-bottom:3px solid var(--blue);

  font-size:clamp(14px,2.3vw,23px);
  font-weight:900;

  text-transform:uppercase;
}

.board-head div,
.row div{
  padding:0 1vw;
}

.schedule{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-rows:
    repeat(10,minmax(0,1fr));
}

.row{
  min-height:0;

  border-bottom:1px solid var(--line);

  font-size:clamp(17px,2.8vw,29px);
  font-weight:700;
}

.row:nth-child(even){
  background:rgba(255,255,255,.025);
}

.ship{
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.passengers{
  text-align:center;
}

.time{
  font-family:monospace;
  font-weight:900;

  text-align:center;
}

.date-cell{
  color:var(--gold);
  font-weight:900;
}


/* EMPTY MESSAGE */

.message{
  grid-column:1/-1;

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:5vh 4vw;

  color:var(--muted);

  font-size:clamp(20px,3vw,32px);
  font-weight:800;
}


/* FOOTER */

footer{
  flex-shrink:0;

  display:flex;
  flex-direction:column;

  align-items:center;

  gap:.4vh;

  padding-top:1.2vh;

  text-align:center;

  color:var(--muted);

  font-size:clamp(12px,1.8vw,19px);
  font-weight:700;
}

#page{
  color:var(--gold);
}

#status{
  color:#62e6a7;
}

</style>
</head>


<body>


<header>

<h1>Halifax Cruise Ships</h1>

<div class="subtitle">
Port of Halifax • Nova Scotia
</div>

<div class="clock" id="clock">
--:--:--
</div>

<div class="date" id="today">
---
</div>

</header>



<div class="board">

<div class="board-head">

<div>Date</div>

<div>Ship</div>

<div>Passengers</div>

<div>Port Time</div>

</div>


<div
  class="schedule"
  id="schedule">
</div>

</div>



<footer>

<div>
Halifax Cruise Ship Schedule
</div>

<div id="page">
PAGE 1 / 1
</div>

<div id="status">
Loading cruise schedule...
</div>

</footer>



<script>

const DATA_FILE =
  "cruise_schedule.json";

const PER_PAGE = 10;

const ROTATE_MS = 12000;

const REFRESH_MS =
  5 * 60 * 1000;


let cruises = [];

let page = 0;

let rotationTimer;


/* CLOCK */

function updateClock(){

  const now =
    new Date();

  document
    .getElementById("clock")
    .textContent =
      now.toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );

  document
    .getElementById("today")
    .textContent =
      now.toLocaleDateString(
        [],
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );
}

updateClock();

setInterval(
  updateClock,
  1000
);



/* RENDER */

function render(){

  const container =
    document.getElementById(
      "schedule"
    );

  if(!cruises.length){

    container.innerHTML =
      `
      <div class="message">
        No Halifax cruise ships
        currently listed.
      </div>
      `;

    document
      .getElementById("page")
      .textContent =
        "PAGE 1 / 1";

    return;
  }


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        cruises.length /
        PER_PAGE
      )
    );


  if(page >= totalPages){
    page = 0;
  }


  const start =
    page * PER_PAGE;


  const current =
    cruises.slice(
      start,
      start + PER_PAGE
    );


  container.innerHTML =
    current.map(item => {

      return `
      <div class="row">

        <div class="date-cell">
          ${item.date || "—"}
        </div>

        <div class="ship">
          ${item.ship || "—"}
        </div>

        <div class="passengers">
          ${item.passengers || "—"}
        </div>

        <div class="time">
          ${item.status || "—"}
        </div>

      </div>
      `;

    }).join("");


  document
    .getElementById("page")
    .textContent =
      `PAGE ${page + 1} / ${totalPages}`;
}



/* ROTATION */

function startRotation(){

  if(rotationTimer){
    clearInterval(
      rotationTimer
    );
  }


  rotationTimer =
    setInterval(
      () => {

        const totalPages =
          Math.max(
            1,
            Math.ceil(
              cruises.length /
              PER_PAGE
            )
          );


        if(totalPages > 1){

          page =
            (page + 1) %
            totalPages;

          render();

        }

      },
      ROTATE_MS
    );
}



/* LOAD SCHEDULE */

async function loadSchedule(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    const response =
      await fetch(
        `${DATA_FILE}?v=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "Invalid cruise schedule"
      );

    }


    /*
      HALIFAX ONLY
    */

    cruises =
      data.filter(
        item =>
          item &&
          item.ship &&
          item.date &&
          String(item.port)
            .toLowerCase()
            .includes("halifax")
      );


    page = 0;

    render();

    startRotation();


    status.style.color =
      "#62e6a7";


    status.textContent =
      "Schedule Loaded • " +
      new Date()
        .toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );


  }catch(error){

    console.error(
      error
    );


    status.style.color =
      "#ff8585";


    status.textContent =
      "Schedule Connection Error";

  }

}



/* START */

loadSchedule();


setInterval(
  loadSchedule,
  REFRESH_MS
);

</script>

</body>
</html>
