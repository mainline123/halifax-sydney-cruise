<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YHZ Live Arrivals Kiosk</title>
  <style>
    :root {
      --bg-color: #080d1a;
      --card-bg: #111a2e;
      --accent-color: #f59e0b;
      --text-color: #ffffff;
      --text-muted: #cbd5e1;
      --status-arrived: #22c55e;
      --status-delayed: #ef4444;
      --status-enroute: #3b82f6;
      --border-color: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 14px;
      border-bottom: 6px solid var(--accent-color);
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .brand-title h1 { font-size: 2.3rem; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; font-weight: 800; }
    .brand-title span { color: var(--accent-color); font-size: 1.4rem; font-weight: 700; display: block; margin-top: 4px; }
    
    .header-right {
      text-align: right;
    }
    .clock { font-size: 2.8rem; font-weight: 800; color: var(--accent-color); font-family: monospace; line-height: 1; }
    .date-str { font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-top: 6px; }

    .board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 20px;
      overflow: hidden;
    }

    .board-header {
      display: flex;
      padding: 14px 12px;
      border-bottom: 3px solid var(--accent-color);
      font-weight: 800;
      color: var(--accent-color);
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .board-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .row {
      flex: 1;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding: 0 12px;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .row:nth-child(even) { background-color: rgba(255, 255, 255, 0.025); }

    .col-flight { width: 22%; font-weight: 900; color: #ffffff; letter-spacing: 0.5px; }
    .col-origin { width: 42%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f1f5f9; }
    .col-time   { width: 18%; font-family: monospace; font-size: 1.7rem; font-weight: 800; color: #ffffff; }
    .col-status { width: 18%; text-align: center; }

    .badge {
      padding: 8px 6px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      display: block;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .arrived { background-color: var(--status-arrived); color: #000; }
    .delayed { background-color: var(--status-delayed); color: #fff; }
    .enroute { background-color: var(--status-enroute); color: #fff; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      margin-top: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-ok { color: #22c55e; }
    .status-warning { color: #ef4444; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <h1>Halifax Stanfield Intl</h1>
      <span>Halifax (YHZ) • Arrivals</span>
    </div>
    <div class="header-right">
      <div class="clock" id="live-clock">--:--:--</div>
      <div class="date-str" id="live-date">-- --- ----</div>
    </div>
  </header>

  <div class="board-container">
    <div class="board-header">
      <div class="col-flight">Flight</div>
      <div class="col-origin">Origin</div>
      <div class="col-time">Time</div>
      <div class="col-status">Status</div>
    </div>
    <div class="board-body" id="arrivals-board">
    </div>
  </div>

  <footer>
    <span>Halifax Stanfield International Airport Information System</span>
    <span id="last-update">Connecting to Published CSV Feed...</span>
  </footer>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTn3TVQ_vFm_MkbHttQgNrP3EwWn9W2Y4ybfY-NmIh3-fRR09O5Qvb0pi7wgOVHO86F0C8lJjFTO2--/pub?output=csv';

    function renderBoard(flights) {
      const container = document.getElementById('arrivals-board');
      if (flights.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; font-size: 1.4rem; color: #cbd5e1;">No flight rows found. Check Google Sheet column structure.</div>';
        return;
      }
      container.innerHTML = flights.map(item => `
        <div class="row">
          <div class="col-flight">${item.flight}</div>
          <div class="col-origin">${item.origin}</div>
          <div class="col-time">${item.time}</div>
          <div class="col-status"><span class="badge ${item.statusClass}">${item.status}</span></div>
        </div>
      `).join('');
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('live-date').innerText = now.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function parseCSVLine(line) {
      const result = [];
      let start = 0;
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') {
          inQuotes = !inQuotes;
        } else if (line[i] === ',' && !inQuotes) {
          result.push(line.substring(start, i).replace(/^"|"$/g, '').trim());
          start = i + 1;
        }
      }
      result.push(line.substring(start).replace(/^"|"$/g, '').trim());
      return result;
    }

    async function fetchCSVData() {
      const updateEl = document.getElementById('last-update');
      try {
        // Force bypass browser cache using a timestamp
        const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
        if (!response.ok) throw new Error('Network response failed');
        
        const text = await response.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        console.log("Raw CSV Lines fetched:", lines.length);

        const flights = lines.map(rowStr => {
          const cols = parseCSVLine(rowStr);
          // Adjust these index numbers if your columns are arranged differently in Google Sheets:
          // cols[0] = Flight, cols[1] = (optional/date), cols[2] = Origin, cols[3] = Time, cols[4] = Status
          const flight = cols[0] || 'N/A';
          const origin = cols[2] || 'Origin';
          const time = cols[3] || '--:--';
          const rawStatus = (cols[4] || 'EN ROUTE').toUpperCase();

          let statusClass = 'enroute';
          if (rawStatus.includes('ARRIVED') || rawStatus.includes('LANDED')) statusClass = 'arrived';
          if (rawStatus.includes('CANCEL') || rawStatus.includes('DELAY')) statusClass = 'delayed';

          return { flight, origin, time, status: rawStatus, statusClass };
        }).filter(f => f.flight !== 'N/A' && f.flight !== 'Flight' && f.flight !== '');

        console.log("Parsed flights array:", flights);

        renderBoard(flights.slice(0, 12));
        updateEl.className = 'status-ok';
        updateEl.innerText = `Synced: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      } catch (err) {
        console.error("CSV fetch error:", err);
        updateEl.className = 'status-warning';
        updateEl.innerText = `Connection Error - ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      }
    }

    fetchCSVData();
    setInterval(fetchCSVData, 30000); // Refreshes board every 30 seconds
  </script>
</body>
</html>
