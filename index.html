<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Scotia Cruise Schedule - Halifax & Sydney</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #060a14;
      color: #ffffff;
    }
    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
      gap: 20px;
    }
    
    /* Top Header Bar */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1a2744;
      padding-bottom: 12px;
    }
    .main-header h1 {
      color: #d4af37;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .datetime {
      color: #00bfff;
      font-size: 24px;
      font-weight: bold;
    }

    /* Container for the two port sections */
    .ports-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-grow: 1;
      overflow: hidden;
    }

    .port-section {
      display: flex;
      background: #0d152a;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1a2744;
      flex: 1;
      max-height: calc(50% - 10px);
    }

    /* Left Branding Sidebar */
    .port-sidebar {
      width: 260px;
      background: linear-gradient(135deg, #0b1836 0%, #060f22 100%);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 2px solid #1a2744;
      flex-shrink: 0;
    }
    .port-sidebar h2 {
      color: #ffffff;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .port-sidebar p {
      color: #8ab4f8;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Right Table Area */
    .table-container {
      flex-grow: 1;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 18px;
      text-align: left;
    }
    th {
      background-color: #121d36;
      color: #00bfff;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 2px solid #1a2744;
    }
    td {
      font-size: 18px;
      border-bottom: 1px solid rgba(26, 39, 68, 0.5);
    }
    tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
    .status-time { background: #202124; color: #bdc1c6; }
    .empty-msg {
      text-align: center;
      padding: 30px;
      color: #8ab4f8;
      font-style: italic;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Header -->
    <div class="main-header">
      <h1>Port of Nova Scotia — Cruise Schedule</h1>
      <div id="live-datetime" class="datetime">Loading...</div>
    </div>

    <!-- Halifax & Sydney Sections -->
    <div class="ports-wrapper">
      
      <!-- HALIFAX SECTION -->
      <div class="port-section">
        <div class="port-sidebar">
          <h2>Halifax</h2>
          <p>Gateway to Nova Scotia. Upcoming arrivals and departures.</p>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Ship Name</th>
                <th>Arrival</th>
                <th>Departure</th>
                <th>Passengers</th>
              </tr>
            </thead>
            <tbody id="halifax-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- SYDNEY SECTION -->
      <div class="port-section">
        <div class="port-sidebar">
          <h2>Sydney</h2>
          <p>Explore Cape Breton Island port schedule.</p>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Ship Name</th>
                <th>Arrival</th>
                <th>Departure</th>
                <th>Passengers</th>
              </tr>
            </thead>
            <tbody id="sydney-tbody">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const optionsDate = { weekday: 'short', month: 'short', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-datetime').textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadSchedule() {
      const jsonUrl = './cruise_schedule.json';

      try {
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        let halifaxHTML = '';
        let sydneyHTML = '';

        data.forEach(item => {
          let arrival = '—';
          let departure = '—';

          if (item.status && item.status.includes('-')) {
            const parts = item.status.split('-').map(t => t.trim());
            if (parts.length === 2) {
              arrival = parts[0];
              departure = parts[1];
            }
          } else if (item.status) {
            arrival = item.status;
          }

          const row = `<tr>
            <td>${item.date}</td>
            <td><strong>${item.ship}</strong></td>
            <td><span class="status-badge status-time">${arrival}</span></td>
            <td><span class="status-badge status-time">${departure}</span></td>
            <td>${item.passengers || 'N/A'}</td>
          </tr>`;

          if (item.port && item.port.toLowerCase() === 'halifax') {
            halifaxHTML += row;
          } else if (item.port && item.port.toLowerCase() === 'sydney') {
            sydneyHTML += row;
          }
        });

        document.getElementById('halifax-tbody').innerHTML = halifaxHTML || '<tr><td colspan="5" class="empty-msg">No scheduled arrivals for Halifax.</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = sydneyHTML || '<tr><td colspan="5" class="empty-msg">No scheduled arrivals for Sydney.</td></tr>';

      } catch (err) {
        console.error('Schedule fetch error:', err);
        document.getElementById('halifax-tbody').innerHTML = '<tr><td colspan="5" class="empty-msg">Unable to load schedule data.</td></tr>';
        document.getElementById('sydney-tbody').innerHTML = '<tr><td colspan="5" class="empty-msg">Unable to load schedule data.</td></tr>';
      }
    }

    loadSchedule();
  </script>
</body>
</html>
